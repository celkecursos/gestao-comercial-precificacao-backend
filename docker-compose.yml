# Ambiente de desenvolvimento.
#   Somente o MySQL (recomendado):  docker compose up -d mysql
#   MySQL + API em container:       docker compose --profile app up -d --build
#   (a API aplica migrations e seeds de demonstração ao iniciar)
# As variáveis são lidas do arquivo .env (com valores padrão abaixo).
services:
  mysql:
    image: mysql:8.4
    container_name: gestao-comercial-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${DB_DATABASE:-gestao_comercial}
      MYSQL_USER: ${DB_USERNAME:-gestao}
      MYSQL_PASSWORD: ${DB_PASSWORD:-gestao_dev_password}
      MYSQL_TEST_DATABASE: ${DB_TEST_DATABASE:-gestao_comercial_test}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '${DB_PORT:-3307}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ['app']
    build: .
    container_name: gestao-comercial-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_MIGRATIONS_RUN: 'true'
      DB_SEED_ON_STARTUP: 'true'
    ports:
      - '${PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
